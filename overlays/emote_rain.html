<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Emote Rain</title>
<style>
  html, body {
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:100vw; height:100vh;
    font: 400 48px/1 "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  }
  #stage {
    position:fixed; inset:0; overflow:hidden;
  }
  .p {
    position:absolute;
    pointer-events:none;
    user-select:none;
    opacity:0;
    transform: translate(-50%,-50%) scale(0);
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.45));
    will-change: transform, opacity;
  }
  .p img {
    display:block; width:100%; height:100%;
    image-rendering:auto;
  }
  .p.emoji { line-height:1; text-align:center; }
  .p.in {
    animation: pop-in 320ms cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .p.out {
    transition: opacity 420ms ease-out, transform 420ms ease-out;
    opacity:0;
  }
  @keyframes pop-in {
    0%   { opacity:0; transform: translate(-50%,-50%) scale(0)    rotate(var(--r,0deg)); }
    60%  { opacity:1; transform: translate(-50%,-50%) scale(1.12) rotate(var(--r,0deg)); }
    100% { opacity:1; transform: translate(-50%,-50%) scale(1)    rotate(var(--r,0deg)); }
  }
</style></head>
<body>
<div id="stage"></div>
<script>
  const STREAM_URL = 'http://localhost:5005/emote_rain';
  const stage = document.getElementById('stage');

  const WINDOW_MS = 3000;
  const recent = [];

  // Эпичность скейлится только количеством и темпом — никаких эффектов сцены.
  // avoid — доля экрана по каждой оси, которую частица старается избегать в центре.
  // 0 = равномерно по всему экрану, 0.6 = центральная зона 60%×60% почти запретна.
  const TIERS = [
    { threshold: 0,  mult: 1, imgSize: [44, 68], emojiSize: [52, 88],  hold: [900, 1500], avoid: 0.0 },
    { threshold: 4,  mult: 1, imgSize: [48, 72], emojiSize: [56, 96],  hold: [700, 1200], avoid: 0.25 },
    { threshold: 12, mult: 2, imgSize: [52, 76], emojiSize: [60, 100], hold: [500, 900],  avoid: 0.45 },
    { threshold: 28, mult: 3, imgSize: [56, 80], emojiSize: [64, 108], hold: [350, 700],  avoid: 0.65 },
  ];

  const MAX_LIVE = 250;
  const live = new Set();
  const POP_IN_MS = 320;
  const FADE_OUT_MS = 420;

  function currentTier() {
    const now = performance.now();
    while (recent.length && now - recent[0] > WINDOW_MS) recent.shift();
    const rate = recent.length;
    let tier = TIERS[0];
    for (const t of TIERS) if (rate >= t.threshold) tier = t;
    return tier;
  }
  const rand = (a, b) => a + Math.random() * (b - a);

  function dropOldest() {
    const oldest = live.values().next().value;
    if (oldest) { oldest.remove(); live.delete(oldest); }
  }

  function spawn(emote, tier) {
    if (live.size >= MAX_LIVE) dropOldest();
    const isImg = emote.type === 'img';
    const [smin, smax] = isImg ? tier.imgSize : tier.emojiSize;
    const size = rand(smin, smax);
    const m = size / 2 + 12;
    const W = window.innerWidth, H = window.innerHeight;
    const cx = W / 2, cy = H / 2;
    // Rejection sampling: чем дальше точка от центра по Chebyshev-метрике (score 0..1),
    // тем выше шанс её принять. При avoid=0 принимаются любые точки, при avoid=1 — только края.
    let x, y;
    for (let attempt = 0; attempt < 8; attempt++) {
      x = rand(m, W - m);
      y = rand(m, H - m);
      const score = Math.max(Math.abs(x - cx) / (W / 2), Math.abs(y - cy) / (H / 2));
      const accept = Math.max(score, 1 - tier.avoid);
      if (Math.random() < accept) break;
    }

    const el = document.createElement('div');
    el.className = 'p' + (isImg ? '' : ' emoji');
    el.style.width  = size + 'px';
    el.style.height = size + 'px';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    const rot = rand(-12, 12);
    el.style.setProperty('--r', rot + 'deg');
    if (isImg) {
      const img = document.createElement('img');
      img.src = emote.url; img.alt = emote.alt || '';
      el.appendChild(img);
    } else {
      el.style.fontSize = size + 'px';
      el.textContent = emote.char || '✨';
    }
    stage.appendChild(el);
    live.add(el);
    requestAnimationFrame(() => el.classList.add('in'));

    const hold = rand(tier.hold[0], tier.hold[1]);
    setTimeout(() => {
      el.style.transform = `translate(-50%,-50%) scale(0.92) rotate(${rot}deg)`;
      el.classList.remove('in');
      el.classList.add('out');
      setTimeout(() => {
        if (el.parentNode) el.remove();
        live.delete(el);
      }, FADE_OUT_MS);
    }, POP_IN_MS + hold);
  }

  function handle(payload) {
    const emotes = (payload && payload.emotes) || [];
    if (!emotes.length) return;
    const now = performance.now();
    for (const _ of emotes) recent.push(now);
    const tier = currentTier();
    for (const e of emotes) {
      for (let i = 0; i < tier.mult; i++) spawn(e, tier);
    }
  }

  const es = new EventSource(STREAM_URL);
  es.onmessage = (e) => {
    try { handle(JSON.parse(e.data)); } catch (_) {}
  };
</script></body></html>
