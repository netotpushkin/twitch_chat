<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Webcam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --glass-bg:    rgba(20, 22, 32, 0.62);
    --glass-bg-2:  rgba(40, 44, 60, 0.46);
    --glass-brd:   rgba(255, 255, 255, 0.20);
    --txt:         #f4f6fb;
    --txt-dim:     rgba(244, 246, 251, 0.72);
    --accent:      #8ab4ff;
    --accent-glow: rgba(138, 180, 255, 0.45);
    --chroma:      #00ff00;
  }
  html, body {
    margin:0; padding:0; background:transparent; overflow:hidden;
    width:100vw; height:100vh;
    color:var(--txt);
    font:500 15px/1.4 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* Полная рамка — оформление 1:1 с youtube.html #win */
  .frame {
    position:fixed; inset:0;
    box-sizing:border-box;
    padding:10px;
    display:flex; flex-direction:column;
    border-radius:20px;
    background:
      linear-gradient(135deg, rgba(30, 80, 170, 0.50) 0%, rgba(40, 44, 60, 0.46) 70%);
    border:1px solid var(--glass-brd);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
  .frame::before {
    content:""; position:absolute; left:14px; right:14px; top:-1px;
    height:3px; border-radius:0 0 3px 3px;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
  }

  .head {
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 10px;
    color:var(--txt);
    text-shadow:0 1px 2px rgba(0,0,0,0.45);
  }
  .head .mark {
    width:28px; height:28px; flex:0 0 28px;
    border-radius:8px;
    background: radial-gradient(circle at 30% 30%,
      rgba(138,180,255,0.50) 0%, rgba(20,30,55,0.55) 100%);
    border:1px solid rgba(138,180,255,0.45);
    box-shadow: 0 0 14px var(--accent-glow),
                inset 0 1px 0 rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center;
  }
  .head .mark svg { width:18px; height:18px; display:block; }
  .head .title {
    flex:1; min-width:0;
    font-weight:700; font-size:13px;
    letter-spacing:0.06em;
    color:var(--txt-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .head .live {
    font-weight:800; font-size:12px;
    letter-spacing:0.14em; text-transform:uppercase;
    color:#ff8a8a;
    text-shadow: 0 0 12px rgba(255,90,90,0.5);
  }

  .chroma-area {
    flex:1; min-height:0;
    border-radius:12px;
    background: var(--chroma);
    border:1px solid rgba(255,255,255,0.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10),
                inset 0 0 0 1px rgba(0,0,0,0.10);
    overflow:hidden;
  }
</style></head><body>
<div class="frame">
  <div class="head">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="14" height="12" rx="2" fill="rgba(255,255,255,0.18)"/>
        <path d="M16 10l5-3v10l-5-3z" fill="rgba(255,255,255,0.18)"/>
      </svg>
    </div>
    <div class="title">Webcam</div>
    <div class="live">LIVE</div>
  </div>
  <div class="chroma-area"></div>
</div>
</body></html>
