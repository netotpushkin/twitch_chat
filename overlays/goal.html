<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Goal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --glass-bg:    rgba(20, 22, 32, 0.62);
    --glass-bg-2:  rgba(40, 44, 60, 0.46);
    --glass-brd:   rgba(255, 255, 255, 0.20);
    --txt:         #f4f6fb;
    --txt-dim:     rgba(244, 246, 251, 0.72);
    /* Между классическим золотым (#ffd76a) и оранжевым (#ff7a3d): тёплый янтарь. */
    --accent:      #ffae4a;
    --accent-glow: rgba(255, 174, 74, 0.50);
    --accent-bg:   rgba(160, 90, 20, 0.50);
    --accent-ring: rgba(255, 174, 74, 0.45);
  }
  html, body {
    margin:0; padding:0; background:transparent; overflow:hidden;
    color:var(--txt);
    font:500 12px/1.4 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #wrap {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .card {
    position:relative;
    box-sizing:border-box;
    width:100%;
    padding:16px 20px 18px;
    border-radius:18px;
    background:
      linear-gradient(135deg, var(--accent-bg) 0%, rgba(40, 44, 60, 0.46) 70%);
    border:1px solid var(--glass-brd);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    color:var(--txt);
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
  }
  .card::before {
    content:""; position:absolute; left:14px; right:14px; top:-1px;
    height:3px; border-radius:0 0 3px 3px;
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .head {
    display:flex; align-items:center; gap:12px;
    min-width:0;
    /* Резервируем под 2 строки заголовка (17px·1.3·2 ≈ 44px) — карточка
       не меняется в высоте: на 1-строчном заголовке title центрируется
       внутри head, на 2-строчном заполняет всю высоту. */
    min-height:calc(2 * 1.3em);
  }
  .mark {
    width:34px; height:34px; flex:0 0 34px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%,
      rgba(255,215,106,0.36) 0%, rgba(60,40,8,0.55) 100%);
    border:1px solid var(--accent-ring);
    box-shadow: 0 0 18px var(--accent-glow),
                inset 0 1px 0 rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
  }
  .mark svg { width:18px; height:18px; display:block; }
  .title {
    flex:1; min-width:0;
    font-weight:700; font-size:17px;
    line-height:1.3;
    letter-spacing:0.01em;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    /* 1 строка → карточка ниже, 2 строки → выше. 3+ обрезаем многоточием. */
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    line-clamp:2;
    overflow:hidden;
  }

  .bar-row {
    margin-top:12px;
    display:flex; align-items:center; gap:12px;
  }
  .bar {
    flex:1; min-width:0;
    height:14px;
    border-radius:8px;
    background: rgba(10, 12, 20, 0.55);
    border:1px solid rgba(255,255,255,0.10);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.45);
    overflow:hidden;
    position:relative;
  }
  .fill {
    height:100%;
    width:0%;
    border-radius:8px;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow),
                inset 0 1px 0 rgba(255,255,255,0.18);
    transition: width 600ms cubic-bezier(.2,.7,.2,1);
  }
  .nums {
    flex:0 0 auto;
    font-weight:800; font-size:12px;
    color: var(--accent);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 0 12px var(--accent-glow);
    letter-spacing:0.01em;
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }
</style></head><body>
<div id="wrap">
  <div class="card" id="card">
    <div class="head">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" fill="rgba(255,255,255,0.10)"/>
          <path d="M12 7v10M9.5 9.5h3.5a1.5 1.5 0 0 1 0 3h-2a1.5 1.5 0 0 0 0 3h3.5"/>
        </svg>
      </div>
      <div class="title" id="title">Сбор</div>
    </div>
    <div class="bar-row">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="nums" id="nums">0 / 0 ₽</div>
    </div>
  </div>
</div>
<script>
  // Относительный путь — работает и при localhost, и при 127.0.0.1, и при любом
  // хосте/порте, на котором поднят overlay_server. Иначе при mismatch hostnames
  // CEF в OBS блокирует SSE как cross-origin.
  const GOAL_URL = '/goal';

  const elCard  = document.getElementById('card');
  const elTitle = document.getElementById('title');
  const elFill  = document.getElementById('fill');
  const elNums  = document.getElementById('nums');

  function fmtAmount(n) {
    if (typeof n !== 'number' || !isFinite(n)) return String(n ?? '');
    const rounded = Math.round(n * 100) / 100;
    const [intp, frac] = String(rounded).split('.');
    const grouped = intp.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return frac ? `${grouped},${frac}` : grouped;
  }

  function render(state) {
    const target = Number(state.target) || 0;
    const progress = Math.max(0, Math.min(Number(state.progress) || 0, target));
    const pct = target > 0 ? (progress / target) * 100 : 0;
    elTitle.textContent = state.title || 'Сбор';
    elFill.style.width = pct.toFixed(2) + '%';
    elNums.textContent = `${fmtAmount(progress)} / ${fmtAmount(target)} ₽`;
  }

  const es = new EventSource(GOAL_URL);
  es.onopen = () => console.log('[goal] SSE открыт', GOAL_URL);
  es.onerror = (e) => console.warn('[goal] SSE ошибка', e);
  es.onmessage = (e) => {
    console.log('[goal] msg', e.data);
    let m;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (!m) return;
    // goal_completed игнорируем — за ним сразу прилетает goal_update
    // с новой целью и прогрессом 0, рендер просто обновит карточку.
    if (m.type === 'goal_update') {
      render(m);
    }
  };
</script></body></html>
