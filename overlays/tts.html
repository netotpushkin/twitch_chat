<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>TTS</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
               font:500 13px/1.3 system-ui,sans-serif; color:#cfd6e4; }
  #badge {
    position:fixed; left:8px; bottom:6px;
    padding:3px 8px; border-radius:8px;
    background:rgba(20,22,32,0.55); border:1px solid rgba(255,255,255,0.12);
    opacity:0.55;
  }
  #badge.playing { background:rgba(80,30,140,0.65); opacity:1; }
  #badge.err     { background:rgba(170,40,40,0.75); opacity:1; }

  /* Кнопка-заглушка — показывается ТОЛЬКО если браузер заблокировал autoplay.
     В OBS Browser Source autoplay разрешён, кнопка не появится. */
  #unlock {
    position:fixed; inset:0;
    display:none; align-items:center; justify-content:center;
    background:rgba(15,18,28,0.78);
    cursor:pointer; user-select:none;
    font:600 22px/1.3 system-ui,sans-serif; color:#ffd76a;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  #unlock.show { display:flex; }
  #unlock span { padding:14px 26px; border-radius:14px;
                 background:rgba(40,30,8,0.7); border:1px solid rgba(255,215,106,0.45); }

  /* Панель отладки — видна всегда, скрывается через ?debug=0 в URL */
  #debug {
    position:fixed; right:8px; top:8px;
    width:380px; max-height:80vh; overflow-y:auto;
    padding:8px 10px; border-radius:10px;
    background:rgba(15,18,28,0.82); border:1px solid rgba(255,255,255,0.14);
    font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;
    color:#e6edf6; pointer-events:none; white-space:pre-wrap;
  }
  #debug .k { color:#9bd3ff; }
  #debug .ok { color:#8df58d; }
  #debug .warn { color:#ffcf6a; }
  #debug .err { color:#ff7d7d; }
  #debug .row { margin-bottom:2px; }
  #debug hr { border:none; border-top:1px solid rgba(255,255,255,0.12); margin:6px 0; }
</style>
</head><body>
<div id="badge">TTS · ожидание</div>
<div id="unlock"><span>🔊 кликни чтобы включить озвучку</span></div>
<div id="debug">init…</div>
<script>
(() => {
  const badge  = document.getElementById("badge");
  const dbg    = document.getElementById("debug");
  const unlock = document.getElementById("unlock");
  const q = [];
  let busy = false;
  let unlocked = false;
  let recv = 0, played = 0, failed = 0;
  let sseState = "init";
  let lastEvent = null;
  let lastError = null;
  const tail = [];          // последние 12 строк лога

  function ts() {
    const d = new Date();
    return d.toTimeString().slice(0,8) + "." + String(d.getMilliseconds()).padStart(3,"0");
  }
  function logLine(cls, msg) {
    tail.push(`<span class="${cls}">[${ts()}] ${msg}</span>`);
    while (tail.length > 12) tail.shift();
    render();
    if (cls === "err")  console.error("[tts]", msg);
    else if (cls === "warn") console.warn("[tts]", msg);
    else console.log("[tts]", msg);
  }
  function render() {
    const sseColor = sseState === "open" ? "ok" : (sseState === "err" || sseState === "reconnect" ? "warn" : "k");
    dbg.innerHTML =
      `<div class="row"><span class="k">URL:</span> ${location.href}</div>` +
      `<div class="row"><span class="k">SSE /tts:</span> <span class="${sseColor}">${sseState}</span></div>` +
      `<div class="row"><span class="k">получено событий:</span> ${recv}` +
        `   <span class="k">сыграно:</span> ${played}` +
        `   <span class="k">сбоев:</span> ${failed}</div>` +
      `<div class="row"><span class="k">очередь:</span> ${q.length}` +
        `   <span class="k">занят:</span> ${busy}</div>` +
      `<div class="row"><span class="k">последнее событие:</span> ${lastEvent ? JSON.stringify(lastEvent) : "—"}</div>` +
      (lastError ? `<div class="row err">ошибка: ${lastError}</div>` : "") +
      `<hr>` +
      tail.join("<br>");
  }

  function setStatus(text, cls) {
    badge.textContent = "TTS · " + text;
    badge.classList.remove("playing","err");
    if (cls) badge.classList.add(cls);
  }

  // AudioContext создаётся лениво. В обычном браузере resume() требует жеста
  // (см. кнопку #unlock), в OBS CEF проходит сразу.
  let audioCtx = null;
  function ac() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tryUnlock() {
    if (unlocked) return;
    const ctx = ac();
    // Если контекст уже running — можем играть. Если ещё suspended — ждём жеста.
    if (ctx.state === "running") {
      unlocked = true;
      unlock.classList.remove("show");
      logLine("ok", "audio unlocked (ctx running)");
      playNext();
    }
  }
  ["click","keydown","touchstart","pointerdown"].forEach(ev =>
    window.addEventListener(ev, tryUnlock, { passive:true })
  );

  function b64ToArrayBuffer(b64) {
    const bin = atob(b64);
    const buf = new ArrayBuffer(bin.length);
    const view = new Uint8Array(buf);
    for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
    return buf;
  }
  function playNext() {
    if (busy) return;
    if (!unlocked) {
      if (q.length) {
        unlock.classList.add("show");
        setStatus("кликни для звука", "err");
      }
      render();
      return;
    }
    const job = q.shift();
    if (!job) { setStatus("ожидание"); render(); return; }
    busy = true;
    setStatus("читаю", "playing");
    render();
    const ctx = ac();
    logLine("k", `decode ${job.id.slice(0,8)} (${job.wav_b64.length} b64-chars)`);
    Promise.resolve()
      .then(() => ctx.decodeAudioData(b64ToArrayBuffer(job.wav_b64)))
      .then(decoded => {
        logLine("ok", `decoded duration=${decoded.duration.toFixed(2)}s`);
        const src = ctx.createBufferSource();
        src.buffer = decoded;
        src.connect(ctx.destination);
        src.onended = () => {
          played++;
          logLine("ok", `ended id=${job.id.slice(0,8)}`);
          busy = false; playNext();
        };
        src.start();
      })
      .catch(err => {
        failed++;
        lastError = `${err.name || ""}: ${err.message}`;
        logLine("err", `play failed: ${err.message}`);
        busy = false; playNext();
      });
  }

  logLine("k", "boot");
  render();
  tryUnlock();   // в OBS пройдёт молча, в браузере покажет кнопку при первом событии

  // Подписываемся на donatty_bus и фильтруем type=tts. Отдельного /tts SSE
  // больше нет — TTS-события мультиплексированы в общий поток, чтобы не упираться
  // в лимит Chromium на 6 коннектов на origin (важно для OBS Browser Source).
  const es = new EventSource("/donatty");
  es.onopen = () => { sseState = "open"; logLine("ok", "SSE /donatty open"); render(); };
  es.onmessage = ev => {
    try {
      const data = JSON.parse(ev.data);
      if (!data || data.type !== "tts") return;   // donation-события не наши
      recv++;
      lastEvent = data;
      logLine("ok", `event #${recv}: ${JSON.stringify(data).slice(0,200)}`);
      if (data.id) {
        q.push(data);
        playNext();
      } else {
        logLine("warn", "tts-событие без id, пропуск");
      }
    } catch (e) {
      logLine("err", `bad JSON: ${e.message}`);
    }
    render();
  };
  es.onerror = () => {
    sseState = (es.readyState === 0 ? "reconnect" : (es.readyState === 2 ? "closed" : "err"));
    logLine("warn", `SSE error, readyState=${es.readyState}`);
    setStatus("реконнект…", "err");
    render();
  };
})();
</script>
</body></html>
