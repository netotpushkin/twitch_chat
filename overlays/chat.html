<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --glass-bg:    rgba(20, 22, 32, 0.62);
    --glass-bg-2:  rgba(40, 44, 60, 0.46);
    --glass-brd:   rgba(255, 255, 255, 0.18);
    --txt:         #f4f6fb;
    --txt-dim:     rgba(244, 246, 251, 0.66);
  }
  html, body {
    margin:0; padding:0; background:transparent; overflow:hidden;
    color:var(--txt);
    font:500 17px/1.4 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  /* Контейнер во весь viewport — сообщения позиционируются absolute внутри */
  #chat {
    position:fixed; inset:0;
    overflow:hidden;
  }

  /* --- Стеклянная карточка сообщения --- */
  .card {
    position:absolute;
    box-sizing:border-box;
    max-width:46%;
    width:max-content;
    padding:8px 14px 10px;
    border-radius:14px;
    background:
      linear-gradient(135deg, var(--glass-bg) 0%, var(--glass-bg-2) 100%);
    border:1px solid var(--glass-brd);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    --bar: rgba(255,255,255,0.22);
    color:var(--txt);
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
    transition: opacity 350ms ease, filter 350ms ease, transform 240ms cubic-bezier(.2,.7,.2,1);
  }
  .card::before {
    content:""; position:absolute; left:0; top:10px; bottom:10px;
    width:3px; border-radius:3px;
    background:var(--bar);
    box-shadow:0 0 8px var(--bar);
  }
  /* Стартовое состояние для появления; снимается на следующем кадре */
  .card.entering {
    opacity:0;
    transform:translateY(8px) scale(0.98);
    filter:blur(4px);
  }

  .head {
    display:flex; align-items:center; gap:6px;
    margin-bottom:2px;
    font-weight:700; font-size:15px; line-height:21px;
    letter-spacing:0.01em;
  }
  .nick {
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.5), 0 0 12px rgba(138,180,255,0.25);
  }
  .badge-img {
    width:18px; height:18px; flex:0 0 18px;
    vertical-align:middle;
    border-radius:4px;
    image-rendering:pixelated;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }

  .body {
    word-wrap:break-word;
    line-height:29px;
    font-weight:500;
    font-size:17px;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:4;
    overflow:hidden;
  }
  .emote {
    vertical-align:middle; margin:0 2px; height:28px; width:auto;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }

  .card.role-sub {
    --bar: #b393ff;
    background: linear-gradient(135deg, rgba(96, 58, 180, 0.50) 0%, rgba(40, 44, 60, 0.46) 70%);
  }
  .card.role-sub .nick { text-shadow:0 1px 3px rgba(0,0,0,0.5), 0 0 12px rgba(179,147,255,0.45); }

  .card.role-vip {
    --bar: #ff8ad9;
    background: linear-gradient(135deg, rgba(170, 40, 140, 0.50) 0%, rgba(40, 44, 60, 0.46) 70%);
  }
  .card.role-vip .nick { text-shadow:0 1px 3px rgba(0,0,0,0.5), 0 0 12px rgba(255,138,217,0.45); }

  .card.role-mod {
    --bar: #5cd882;
    background: linear-gradient(135deg, rgba(28, 130, 70, 0.50) 0%, rgba(40, 44, 60, 0.46) 70%);
  }
  .card.role-mod .nick { text-shadow:0 1px 3px rgba(0,0,0,0.5), 0 0 12px rgba(92,216,130,0.45); }

  .card.role-broadcaster {
    --bar: #ff6a6a;
    background: linear-gradient(135deg, rgba(180, 40, 40, 0.52) 0%, rgba(40, 44, 60, 0.46) 70%);
  }
  .card.role-broadcaster .nick { text-shadow:0 1px 3px rgba(0,0,0,0.5), 0 0 12px rgba(255,106,106,0.5); }

  .card.first {
    --bar: #ffc26a;
    background: linear-gradient(135deg, rgba(200, 130, 30, 0.52) 0%, rgba(40, 44, 60, 0.46) 70%);
  }
  .card.first .nick { text-shadow:0 1px 3px rgba(0,0,0,0.5), 0 0 14px rgba(255,194,106,0.55); }
  .card.first::after {
    content: "★";
    position: absolute;
    top: -14px;
    right: -10px;
    font-size: 26px;
    line-height: 1;
    color: #ffc26a;
    text-shadow:
      0 0 6px rgba(255,194,106,0.95),
      0 0 14px rgba(255,194,106,0.7),
      0 2px 3px rgba(0,0,0,0.55);
    transform: rotate(14deg);
    transform-origin: center;
    pointer-events: none;
  }

  /* Корона над сообщениями текущего короля (последний задонативший). */
  .card.king {
    --bar: #ffd76a;
    background: linear-gradient(135deg, rgba(180, 130, 20, 0.55) 0%, rgba(40, 44, 60, 0.46) 70%);
  }
  .card.king .nick {
    text-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 0 14px rgba(255,215,106,0.6);
  }
  /* Корона — отдельный <span>, чтобы не конфликтовать с .card::before (полоска
     слева) и .card.first::after (звезда первого сообщения). */
  .card .crown {
    position: absolute;
    top: -16px;
    left: -8px;
    font-size: 22px;
    line-height: 1;
    text-shadow:
      0 0 6px rgba(255,215,106,0.95),
      0 0 14px rgba(255,215,106,0.7),
      0 2px 3px rgba(0,0,0,0.55);
    transform: rotate(-12deg);
    transform-origin: center;
    pointer-events: none;
    z-index: 1;
  }

  .deleted { color:var(--txt-dim); font-style:italic; }
</style></head><body>
<div id="chat"></div>
<script>
  const MAX = 10;                  // меньше карточек — меньше визуального шума
  const PAD = 12;                  // отступ от краёв viewport
  const OPACITY_MIN = 0.20;        // самая старая
  const OPACITY_MAX = 1.00;        // самая новая
  const STREAM_URL = 'http://localhost:5005/stream';
  const chat = document.getElementById('chat');
  let channelName = '';
  const es = new EventSource(STREAM_URL);
  es.addEventListener('config', (e) => {
    try {
      const cfg = JSON.parse(e.data);
      if (cfg.channel) channelName = cfg.channel;
    } catch (_) {}
  });

  // Список активных карточек, по порядку добавления (старые -> новые).
  const live = [];
  let zCounter = 1;

  function markDeleted(el) {
    const t = el.querySelector('.body');
    if (t) t.innerHTML = '<span class="deleted">&lt;Сообщение удалено&gt;</span>';
    // Текст-плейсхолдер может быть длиннее исходного и расширить карточку — клампим.
    clampPosition(el);
  }

  const pending = [];
  let scheduled = false;

  function buildMsg(m) {
    const d = document.createElement('div');
    let role = m.role;
    if (!role && m.badges && m.badges.some(b => /sub|founder/i.test(b.alt || ''))) {
      role = 'sub';
    }
    const cls = ['card'];
    if (m.first) cls.push('first');
    if (m.king)  cls.push('king');
    if (role) cls.push('role-' + role);
    d.className = cls.join(' ');
    if (m.id)    d.dataset.id    = m.id;
    if (m.login) d.dataset.login = m.login;

    let badgesHtml = '';
    if (m.badges && m.badges.length) {
      badgesHtml = m.badges.map(b =>
        `<img class="badge-img" src="${b.url}" alt="${escapeHtml(b.alt)}" title="${escapeHtml(b.alt)}">`
      ).join('');
    }
    const nick = `<span class="nick">${escapeHtml(m.user)}</span>`;
    const crown = m.king ? '<span class="crown">👑</span>' : '';
    d.innerHTML =
      crown +
      '<div class="head">' + badgesHtml + nick + '</div>' +
      '<div class="body">' + m.html + '</div>';
    return d;
  }

  // Случайная позиция в пределах chat-контейнера с учётом размеров карточки.
  function placeRandom(el) {
    const cw = chat.clientWidth;
    const ch = chat.clientHeight;
    const ew = el.offsetWidth;
    const eh = el.offsetHeight;
    const maxX = Math.max(0, cw - ew - PAD * 2);
    const maxY = Math.max(0, ch - eh - PAD * 2);
    el.style.left = (PAD + Math.random() * maxX) + 'px';
    el.style.top  = (PAD + Math.random() * maxY) + 'px';
  }

  // Если карточка после первичного позиционирования «выросла» (доехали эмоуты/бейджи),
  // клампим её обратно в границы окна.
  function clampPosition(el) {
    const cw = chat.clientWidth;
    const ch = chat.clientHeight;
    const ew = el.offsetWidth;
    const eh = el.offsetHeight;
    let x = parseFloat(el.style.left) || 0;
    let y = parseFloat(el.style.top)  || 0;
    x = Math.min(Math.max(PAD, x), Math.max(PAD, cw - ew - PAD));
    y = Math.min(Math.max(PAD, y), Math.max(PAD, ch - eh - PAD));
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
  }

  // Пересчитать opacity, обесцвечивание и z-index. Чем старее — тем прозрачнее и серее.
  function reorder() {
    const n = live.length;
    for (let i = 0; i < n; i++) {
      const age = n - 1 - i;   // 0 = самая новая
      // Фейд считаем относительно лимита MAX, а не текущего числа сообщений,
      // иначе при n=2 второе сразу становится максимально прозрачным.
      const t = MAX <= 1 ? 0 : Math.min(1, age / (MAX - 1));
      const op = OPACITY_MAX - (OPACITY_MAX - OPACITY_MIN) * t;
      const gs = t;            // 0 — цветная, 1 — полностью ч/б
      const el = live[i];
      el.style.opacity = op.toFixed(3);
      el.style.filter  = `grayscale(${gs.toFixed(3)})`;
      el.style.zIndex  = String(i + 1);
    }
  }

  function addCard(el) {
    el.classList.add('entering');
    chat.appendChild(el);
    // Размеры доступны сразу после append. Ставим случайную позицию ДО первого кадра анимации.
    placeRandom(el);
    // Эмоуты/бейджи догружаются асинхронно — после каждой загрузки карточка может
    // расшириться. Клампим позицию обратно в границы.
    el.querySelectorAll('img').forEach(img => {
      if (img.complete) return;
      const onDone = () => clampPosition(el);
      img.addEventListener('load',  onDone, { once: true });
      img.addEventListener('error', onDone, { once: true });
    });
    live.push(el);
    while (live.length > MAX) {
      const old = live.shift();
      old.remove();
    }
    reorder();
    // Снимаем "entering" на следующем кадре — transitions подхватят целевые значения.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.remove('entering');
    }));
  }

  function flush() {
    scheduled = false;
    if (!pending.length) return;
    for (const m of pending) {
      if (m.type === 'clearmsg') {
        if (m.id) {
          const el = chat.querySelector(`[data-id="${CSS.escape(m.id)}"]`);
          if (el) markDeleted(el);
        }
        continue;
      }
      if (m.type === 'clearchat') {
        if (m.login) {
          chat.querySelectorAll(`[data-login="${CSS.escape(m.login)}"]`).forEach(markDeleted);
        } else {
          chat.replaceChildren();
          live.length = 0;
        }
        continue;
      }
      addCard(buildMsg(m));
    }
    pending.length = 0;
  }

  es.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    pending.push(m);
    if (!scheduled) {
      scheduled = true;
      requestAnimationFrame(flush);
    }
  };

  // При ресайзе окна — перепозиционируем карточки, чтобы не вылезали за края.
  window.addEventListener('resize', () => {
    for (const el of live) {
      const x = parseFloat(el.style.left) || 0;
      const y = parseFloat(el.style.top)  || 0;
      const maxX = Math.max(0, chat.clientWidth  - el.offsetWidth  - PAD);
      const maxY = Math.max(0, chat.clientHeight - el.offsetHeight - PAD);
      el.style.left = Math.min(Math.max(PAD, x), maxX) + 'px';
      el.style.top  = Math.min(Math.max(PAD, y), maxY) + 'px';
    }
  });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script></body></html>
